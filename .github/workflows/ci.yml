name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  resource-limits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - name: Startup/case watchdogs and descendant cleanup
        run: |
          cargo test --locked --lib harness::tests::recorder_ -- --nocapture
      - name: Controlled memory pressure (child RLIMIT_AS = 256 MiB)
        run: |
          cargo test --locked --lib recording_hard_memory_limit_is_enforced -- --ignored --nocapture

  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux Bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Check isolation options and actual boundary on supported hosts
        run: |
          cargo test --locked isolation::tests:: -- --nocapture
          cargo test --locked isolated_app_record_and_replay -- --nocapture

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo install --path .
      - name: Install the wasm-bindgen CLI the wasm demo uses
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' demo/fixtures/classes-rs/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Gate every demo port
        run: |
          for crate in demo/fixtures/*-rs; do
            rust-anything gate "$crate"
          done

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: Swatinem/rust-cache@v2
      - name: Test Windows command parsing
        run: cargo test --locked --lib app::tests::shell_words
      - name: Test process-tree termination (Windows)
        run: cargo test --locked --lib recorder_terminates_windows_subprocess_tree -- --nocapture
      - name: Run native bridge integration tests
        run: cargo test --locked --test native -- --nocapture

  # The whole loop on a real port: build both bridges and pass the gate.
  demo:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --path .
      - name: Gate the fixture ports
        run: |
          for crate in demo/fixtures/async-rs; do
            rust-anything gate "$crate"
          done
